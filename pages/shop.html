<body data-root="../" data-page="shop">
<div id="site-header"></div>
<main id="main">
<noscript><p style="padding:24px">This demo store needs JavaScript for its catalog, bag and navigation.</p></noscript>

<div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Shop</span></nav>
<header class="shop-head"><h1 class="display">Shop all</h1><div class="shop-head__meta"><b><span id="catCount">–</span><span class="mono"> / <span id="catTotal">–</span></span></b><p>Pieces, newest and most-loved first.</p></div></header></div>
<div class="catbar"><div class="wrap catbar__in">
  <button type="button" class="fbtn fbtn--line fbtn--sm" data-filters-open aria-haspopup="dialog">Filters <span class="fcount" data-filter-count hidden>0</span></button>
  <span class="catbar__count mono" id="catLive" aria-live="polite"></span>
  <div class="views" role="group" aria-label="Grid density"><button type="button" data-view="2" aria-pressed="false" aria-label="2 columns">2</button><button type="button" data-view="3" aria-pressed="true" aria-label="3 columns">3</button><button type="button" data-view="4" aria-pressed="false" aria-label="4 columns">4</button></div>
  <label class="vh" for="sortSelect">Sort by</label><select id="sortSelect"></select>
</div></div>
<div class="wrap catalog catalog--side"><aside class="filters-wrap " id="filtersWrap" aria-label="Filters"><div class="filters">
  <div class="filters__head"><h2>Filters</h2><button type="button" class="icon-btn" data-filters-apply aria-label="Close filters"><i data-lucide="x"></i></button></div>
  <form id="filtersForm" novalidate></form>
  <div class="filters__foot"><button type="button" class="fbtn fbtn--line" data-clear>Clear all</button><button type="button" class="fbtn fbtn--ink" data-filters-apply>Show results</button></div>
</div></aside><div><div class="chips" id="activeChips" hidden aria-label="Active filters"></div>
  <ul class="cgrid" id="catGrid" data-cols="3"></ul>
  <div class="catempty" id="catEmpty" hidden></div>
  <div class="more" id="catMore" hidden></div></div></div>
